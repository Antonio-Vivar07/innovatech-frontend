version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
    container_name: innovatech-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - innovatech-network

networks:
  innovatech-network:
    driver: bridge