name: CI/CD Frontend - Innovatech Chile

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    name: Construir imagen y desplegar en EC2
    runs-on: self-hosted

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Construir y publicar imagen en Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=http://10.0.2.136:8081
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-frontend:${{ github.sha }}

      - name: Desplegar en EC2 Frontend
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_KEY" > /tmp/deploy_key.pem
          chmod 600 /tmp/deploy_key.pem
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key.pem $EC2_USER@$EC2_HOST "docker login -u $DOCKER_USER -p $DOCKER_TOKEN && docker pull $DOCKER_USER/innovatech-frontend:latest && docker stop innovatech-frontend || true && docker rm innovatech-frontend || true && docker run -d --name innovatech-frontend --restart unless-stopped -p 80:80 $DOCKER_USER/innovatech-frontend:latest"

      - name: Limpiar claves
        if: always()
        run: rm -f /tmp/deploy_key.pem